# Lets Claude respond when someone mentions @claude in the repository.
# It calls the organization's reusable workflow in company-workflow-blocks and passes the repository's Claude Code token.

name: Respond to @claude mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: hastewell/company-workflow-blocks/.github/workflows/respond-to-claude-mention.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
